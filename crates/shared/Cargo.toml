[package]
name = "dark-rift-shared"
version.workspace = true
edition.workspace = true

[dependencies]
# `std` enables `bevy_ecs::ParallelCommands` required by `lightyear_messages` when building this crate alone.
bevy = { workspace = true, default-features = false, features = ["serialize", "std", "bevy_log"] }
serde = { workspace = true }
rand = { workspace = true }
lightyear = { workspace = true }
bincode = { workspace = true }
serde_json = "1.0.149"
bitfield = "0.19.4"
bevy_rand = { workspace = true }
bevy_prng = { workspace = true }
rand_core = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
