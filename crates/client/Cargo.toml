[package]
name = "dark-rift-client"
version.workspace = true
edition.workspace = true

[dependencies]
# `std::time::Instant` panics on wasm32-unknown-unknown; this uses `performance.now()` in the browser.
instant = { version = "0.1", features = ["wasm-bindgen"] }
dark-rift-shared = { path = "../shared" }
# Needed for `#[derive(Component)]` / `States` when `bevy` is target-gated (proc macros resolve direct crates).
bevy_ecs = "0.18"
bevy_state = "0.18"
serde = { workspace = true }
serde_json = "1.0.149"
clap = { version = "4.6.0", features = ["derive"] }
rand = { workspace = true }
lightyear = { workspace = true, features = ["websocket", "client", "netcode"] }
aeronet_io = { workspace = true }
aeronet_websocket = { workspace = true }
ron = "0.8.1"
miniz_oxide = "0.8"
bevy_enoki = "0.6.0"
crossbeam-channel = "0.5"
bytemuck = { version = "1", features = ["derive"] }
bevy = { version = "0.18" }

# Feature gate: `dev_native` enables Bevy's dynamic_linking for fast incremental
# dev builds on desktop.  Release / distribution builds must NOT enable this
# feature or the binary will depend on libbevy_dylib-*.so at runtime.
[features]
dev_native = ["bevy/dynamic_linking"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "2.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
js-sys = "0.3.95"
wasm-bindgen = "0.2.120"
web-sys = { version = "0.3.97", features = ["Window", "Storage"] }

[target.wasm32-unknown-unknown.dependencies]
gloo-net = "0.3"
wasm-bindgen-futures = "0.4"

