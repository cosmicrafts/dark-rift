[package]
name = "dark-rift-client"
version.workspace = true
edition.workspace = true

[dependencies]
# `std::time::Instant` panics on wasm32-unknown-unknown; this uses `performance.now()` in the browser.
instant = { version = "0.1", features = ["wasm-bindgen"] }
dark-rift-shared = { path = "../shared" }
# Needed for `#[derive(Component)]` / `States` when `bevy` is target-gated (proc macros resolve direct crates).
bevy_ecs = "0.18"
bevy_state = "0.18"
serde = { workspace = true }
serde_json = "1.0.149"
clap = { version = "4.6.0", features = ["derive"] }
rand = { workspace = true }
lightyear = { workspace = true, features = ["websocket", "client", "netcode"] }
aeronet_io = { workspace = true }
aeronet_websocket = { workspace = true }
ron = "0.8.1"
miniz_oxide = "0.8"
bevy_enoki = "0.6.0"
crossbeam-channel = "0.5"
bytemuck = { version = "1", features = ["derive"] }
bevy = { version = "0.18" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.18", features = ["dynamic_linking"] }
ureq = "2.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"

[target.wasm32-unknown-unknown.dependencies]
gloo-net = "0.3"
wasm-bindgen-futures = "0.4"

