[package]
name = "dark-rift-map-generator"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
geo = "0.28"
geo-types = "0.7"
bincode = "1.3"
clap = { version = "4.4", features = ["derive"] }

dark-rift-shared = { path = "../shared" }
