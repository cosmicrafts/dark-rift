[package]
name = "dr-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dark Rift — Main client, egui HUD, and event loop"

[dependencies]
blade-graphics = { workspace = true }
blade-macros = { workspace = true }
blade-egui = { workspace = true }
dr-core = { path = "../dr-core" }
dr-render = { path = "../dr-render" }
egui = { workspace = true }
egui-winit = { workspace = true }
winit = { workspace = true }
bytemuck = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
web-time = { workspace = true }
glam = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1.0"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "Navigator", "Storage"] }
