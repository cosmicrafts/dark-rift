[workspace]
resolver = "2"
members = [
    "crates/dr-core",
    "crates/dr-render",
    "crates/dr-client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Dark Rift Team"]

[workspace.dependencies]
blade-graphics = { git = "https://github.com/ohsalmeron/blade", rev = "0223b8faaee1f03f7566a7ea13d239b60391359d" }
blade-macros = { git = "https://github.com/ohsalmeron/blade", rev = "0223b8faaee1f03f7566a7ea13d239b60391359d" }
blade-egui = { git = "https://github.com/ohsalmeron/blade", rev = "0223b8faaee1f03f7566a7ea13d239b60391359d" }
bytemuck = { version = "1", features = ["derive"] }
egui = { version = "0.34", default-features = false }
egui-winit = { version = "0.34", default-features = false, features = ["links"] }
winit = { version = "0.30" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
log = "0.4"
env_logger = "0.11"
web-time = "1.1"
libm = "0.2"
raw-window-handle = "0.6"
glam = { version = "0.30", features = ["bytemuck", "serde"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
