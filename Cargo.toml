[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/server",
    "crates/client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"

[workspace.dependencies]
bevy = { version = "0.18", default-features = false }
serde = { version = "1", features = ["derive"] }
rand = "0.8"
lightyear = { version = "0.26.4", default-features = false }
bincode = "1.3"
aeronet_io = "0.19.1"
aeronet_websocket = "0.19.1"
bevy_rand = { version = "0.14", features = ["wyrand"] }
bevy_prng = { version = "0.14", features = ["wyrand"] }
rand_core = "0.10"

# Enable optimizations for dependencies (incl. Bevy ECS and math) in debug mode
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 'z'      # Optimizar máximo para tamaño (z es más agresivo que s)
lto = true           # Link Time Optimization (corta código muerto)
codegen-units = 1    # Compilación más lenta pero binario más chico
strip = true         # Quitar TODOS los símbolos (no solo debuginfo)
