[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/server",
    "crates/client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"

[workspace.dependencies]
bevy = { version = "0.18", default-features = false }
serde = { version = "1", features = ["derive"] }
rand = "0.8"
lightyear = "0.26.4"
bincode = "1.3"
